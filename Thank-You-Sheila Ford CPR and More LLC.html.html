  .btn{

    padding:12px 26px;
    border-radius:3px;
    font-weight:600;

  .pay{background:#F6F3EC;border:1px solid var(--line);border-radius:6px;padding:20px;margin:0 0 24px 0;}
  .pay h2{font-family:'Roboto Slab',serif;font-size:18px;color:var(--navy);margin:0 0 8px 0;}
  .pay p{margin:0 0 14px 0;font-size:14.5px;}
